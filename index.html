<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="錢錢小管家">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>我的錢錢小管家</title>
<style>
:root{
 --pink:#f7c9d9;--purple:#d9cff6;--blue:#cdeafa;--yellow:#ffe7a9;--mint:#ccefdc;
 --ink:#514a56;--muted:#8b8390;--line:#eee7ee;--card:#fff;--shadow:0 10px 30px rgba(82,65,89,.09)
}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(180deg,#fff8fb,#fffdf8);color:var(--ink)}
button,input,select{font:inherit}.app{max-width:540px;margin:auto;min-height:100vh;padding-bottom:102px}
header{padding:18px 15px 8px}.hello{display:flex;justify-content:space-between;align-items:center}.who{display:flex;gap:10px;align-items:center}
.avatar{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--pink),var(--purple));display:grid;place-items:center;font-size:31px;box-shadow:var(--shadow)}
h1{font-size:22px;margin:0}.sub,.mini{font-size:12px;color:var(--muted)}main{padding:8px 15px 24px}.page{display:none}.page.active{display:block}
.card,.balance{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px}
.balance{background:linear-gradient(135deg,#fff,#fdf3fb);padding:20px}.money{font-size:36px;font-weight:800;margin:4px 0 12px}
.wallets,.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wallet,.stat{text-align:center;border-radius:18px;padding:12px 6px;font-size:12px}.wallet b,.stat b{display:block;font-size:16px;margin-top:4px}
.w1{background:#fff1f6}.w2{background:#f2efff}.w3{background:#eef9ff}.s1{background:#edf9f2}.s2{background:#fff1f6}.s3{background:#f2efff}
.actions,.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{margin:14px 0}.action{border:0;border-radius:20px;padding:15px;font-weight:800;box-shadow:var(--shadow)}.income{background:var(--mint)}.expense{background:var(--pink)}
.section{margin-top:18px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}.section-title h2{font-size:18px;margin:0}.link{border:0;background:transparent;color:#8068b8;font-weight:700}
.primary,.secondary,.danger{width:100%;border-radius:18px;padding:13px;font-weight:800}.primary{border:0;background:linear-gradient(135deg,var(--pink),var(--purple));color:#4e3f59}.secondary{border:1px solid var(--line);background:#fff}.danger{border:1px solid #f1ced8;background:#fff6f8;color:#b65270}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:15px;background:#fff;color:var(--ink)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.rowgap{display:grid;gap:10px}
.tx,.task,.goalrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}.tx:last-child,.task:last-child,.goalrow:last-child{border-bottom:0}.plus{color:#379260}.minus{color:#cf5f7d}
.tag{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;margin-top:5px}.need{background:#eaf8ef;color:#347850}.want{background:#fff1f4;color:#a44d68}
.badges{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.badge{background:#fff8dd;border-radius:20px;padding:14px;text-align:center}.badge span{font-size:30px;display:block}
.goalpic{width:58px;height:58px;border-radius:18px;background:#fff5cf;display:grid;place-items:center;font-size:31px;overflow:hidden}.goalpic img{width:100%;height:100%;object-fit:cover}.goalmain{display:flex;gap:10px;align-items:center;flex:1}.goalinfo{flex:1}.bar{height:9px;background:#f1edf2;border-radius:999px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--purple))}
.taskdone{opacity:.55;text-decoration:line-through}.amountbtn{border:0;border-radius:999px;background:#edf9f2;padding:8px 10px;font-weight:800;color:#347850}
.review{background:linear-gradient(135deg,#fff9e8,#fff);border:1px solid #f3e6bd}.reviewbig{font-size:28px;font-weight:800}.reviewline{margin-top:7px}.reviewmsg{margin-top:12px;padding:12px;border-radius:16px;background:#fff}
.preview{width:100%;aspect-ratio:16/9;border-radius:18px;background:#faf7fb;border:1px dashed #dfd6e2;display:grid;place-items:center;overflow:hidden;margin:10px 0}.preview img{width:100%;height:100%;object-fit:cover}
nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(500px,calc(100% - 20px));display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);padding:7px;border-radius:24px;box-shadow:0 12px 40px rgba(65,48,75,.18);z-index:20}
nav button{border:0;background:transparent;padding:8px 1px;border-radius:16px;color:var(--muted);font-size:10px}nav button.active{background:#f3ecfb;color:#684fa0;font-weight:800}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#514a56;color:#fff;padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1}.hidden{display:none}.empty{text-align:center;color:var(--muted);padding:18px}
</style>
</head>
<body>
<div class="app">
<header>
<div class="hello">
  <div class="who"><div class="avatar" id="headerAvatar">🐰</div><div><div class="sub">小小理財家 ✨</div><h1 id="helloName">我的錢錢</h1></div></div>
  <button class="secondary" style="width:auto;padding:9px 12px" onclick="go('profile')">⚙️</button>
</div>
</header>

<main>
<section id="home" class="page active">
  <div class="balance">
    <div class="sub">我現在有</div><div class="money" id="totalMoney">$0</div>
    <div class="wallets">
      <div class="wallet w1">💗 可以花<b id="spendMoney">$0</b></div>
      <div class="wallet w2">🌟 存起來<b id="saveMoney">$0</b></div>
      <div class="wallet w3">🤝 分享<b id="shareMoney">$0</b></div>
    </div>
  </div>
  <div class="actions"><button class="action income" onclick="quickAdd('income')">＋ 我有收入</button><button class="action expense" onclick="quickAdd('expense')">－ 我有花錢</button></div>

  <div class="section"><div class="section-title"><h2>📊 本月總覽</h2><button class="link" onclick="go('review')">月回顧</button></div>
  <div class="card"><div class="stats"><div class="stat s1">收入<b id="mIncome">$0</b></div><div class="stat s2">花費<b id="mExpense">$0</b></div><div class="stat s3">存款<b id="mSaved">$0</b></div></div></div></div>

  <div class="section"><div class="section-title"><h2>✅ 今天的任務</h2><button class="link" onclick="go('tasks')">全部</button></div><div class="card" id="homeTasks"></div></div>
  <div class="section"><div class="section-title"><h2>🎯 存錢願望</h2><button class="link" onclick="go('goals')">全部</button></div><div class="card" id="homeGoals"></div></div>
</section>

<section id="record" class="page">
  <div class="section-title"><h2>🧾 記一筆錢錢</h2></div>
  <div class="card">
    <div class="form-row"><select id="type"><option value="income">收入</option><option value="expense">支出</option></select><input id="amount" inputmode="numeric" placeholder="金額"></div>
    <div class="form-row"><select id="wallet"><option value="spend">可以花</option><option value="save">存起來</option><option value="share">分享</option></select><input id="date" type="date"></div>
    <div class="form-row"><select id="kind"><option value="none">不分類</option><option value="need">需要</option><option value="want">想要</option></select><select id="category"><option>零用錢</option><option>獎勵</option><option>文具</option><option>點心</option><option>玩具</option><option>其他</option></select></div>
    <input id="note" placeholder="這筆是什麼？" style="margin-bottom:10px"><button class="primary" onclick="addTx()">存起來</button>
  </div>
  <div class="section"><div class="section-title"><h2>最近紀錄</h2></div><div class="card" id="txList"></div></div>
</section>

<section id="tasks" class="page">
  <div class="section-title"><h2>✅ 任務賺零用錢</h2></div>
  <div class="card">
    <input id="taskName" placeholder="任務，例如：整理書桌" style="margin-bottom:10px">
    <div class="form-row"><input id="taskReward" inputmode="numeric" placeholder="獎勵金額"><select id="taskWallet"><option value="spend">放進可以花</option><option value="save">放進存起來</option><option value="share">放進分享</option></select></div>
    <button class="primary" onclick="addTask()">新增任務</button>
  </div>
  <div class="section"><div class="card" id="taskList"></div></div>
</section>

<section id="goals" class="page">
  <div class="section-title"><h2>🎯 多個存錢願望</h2></div>
  <div class="card">
    <input id="goalName" placeholder="願望名稱" style="margin-bottom:10px">
    <div class="form-row"><input id="goalTarget" inputmode="numeric" placeholder="目標金額"><input id="goalEmoji" maxlength="2" value="🎁"></div>
    <input id="goalImage" type="file" accept="image/*" onchange="loadGoalImage(event)">
    <div class="preview" id="goalPreview">📷 可以放願望圖片</div>
    <button class="primary" onclick="addGoal()">新增願望</button>
  </div>
  <div class="section"><div class="card" id="goalList"></div></div>
</section>

<section id="transfer" class="page">
  <div class="section-title"><h2>🔁 錢包轉帳</h2></div>
  <div class="card">
    <div class="form-row"><select id="fromWallet"><option value="spend">可以花</option><option value="save">存起來</option><option value="share">分享</option></select><select id="toWallet"><option value="save">存起來</option><option value="spend">可以花</option><option value="share">分享</option></select></div>
    <input id="transferAmount" inputmode="numeric" placeholder="轉多少錢？" style="margin-bottom:10px">
    <button class="primary" onclick="transferMoney()">確認轉帳</button>
  </div>
  <div class="section"><div class="card"><div class="mini">例如：今天決定少買一個東西，就可以把「可以花」的錢轉到「存起來」。</div></div></div>
</section>

<section id="review" class="page">
  <div class="section-title"><h2>📅 每月回顧卡</h2></div>
  <div class="card"><input id="reviewMonth" type="month" onchange="renderReview()"></div>
  <div class="section"><div class="card review" id="reviewCard"></div></div>
  <div class="section"><div class="section-title"><h2>需要 vs 想要</h2></div><div class="card"><div class="stats"><div class="stat s1">需要<b id="rNeed">$0</b></div><div class="stat s2">想要<b id="rWant">$0</b></div><div class="stat">未分類<b id="rNone">$0</b></div></div></div></div>
</section>

<section id="profile" class="page">
  <div class="section-title"><h2>👤 我的設定</h2></div>
  <div class="card rowgap">
    <input id="childName" placeholder="我的名字">
    <select id="avatarSelect"><option value="🐰">🐰 兔兔</option><option value="🐻">🐻 小熊</option><option value="🐱">🐱 貓咪</option><option value="🐶">🐶 狗狗</option><option value="🦄">🦄 獨角獸</option></select>
    <button class="primary" onclick="saveProfile()">儲存資料</button>
  </div>

  <div class="section"><div class="section-title"><h2>🏅 成就牆</h2></div><div class="badges" id="badgeWall"></div></div>

  <div class="section"><div class="card rowgap">
    <button class="secondary" onclick="exportBackup()">⬇️ 匯出備份</button>
    <button class="secondary" onclick="document.getElementById('importFile').click()">⬆️ 匯入備份</button>
    <input class="hidden" id="importFile" type="file" accept=".json,application/json" onchange="importBackup(event)">
    <button class="danger" onclick="resetAll()">清除全部資料</button>
  </div></div>
</section>
</main>

<nav>
<button class="active" data-page="home" onclick="go('home')">🏠<br>首頁</button>
<button data-page="record" onclick="go('record')">✏️<br>記帳</button>
<button data-page="tasks" onclick="go('tasks')">✅<br>任務</button>
<button data-page="goals" onclick="go('goals')">🎯<br>願望</button>
<button data-page="transfer" onclick="go('transfer')">🔁<br>轉帳</button>
<button data-page="review" onclick="go('review')">📊<br>回顧</button>
</nav>
</div>
<div class="toast" id="toast"></div>

<script>
const KEY='kidsMoneyAppV4', V3='kidsMoneyAppV3', V2='kidsMoneyAppV2';
const defaultData={
 profile:{name:'小小理財家',avatar:'🐰'},
 wallets:{spend:0,save:0,share:0},
 tx:[], tasks:[], goals:[], badges:[], transfers:[]
};

function migrate(){
  let raw=localStorage.getItem(KEY);
  if(raw) return JSON.parse(raw);
  let old=localStorage.getItem(V3)||localStorage.getItem(V2);
  if(old){
    let x=JSON.parse(old);
    let d=JSON.parse(JSON.stringify(defaultData));
    d.profile=x.profile||d.profile; d.wallets=x.wallets||d.wallets; d.tx=x.tx||[]; d.badges=x.badges||[];
    if(x.goal && x.goal.name){
      d.goals=[{id:Date.now(),name:x.goal.name,target:Number(x.goal.target)||0,emoji:x.goal.emoji||'🎁',image:x.goal.image||'',saved:Math.min(Number(d.wallets.save)||0,Number(x.goal.target)||0),done:false}];
    }
    localStorage.setItem(KEY,JSON.stringify(d));
    return d;
  }
  return JSON.parse(JSON.stringify(defaultData));
}
let data=migrate();
const $=id=>document.getElementById(id);
function today(){return new Date().toISOString().slice(0,10)}
function monthNow(){return today().slice(0,7)}
$('date').value=today(); $('reviewMonth').value=monthNow();
function fmt(n){return '$'+Math.round(Number(n)||0).toLocaleString('zh-TW')}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function walletName(w){return ({spend:'可以花',save:'存起來',share:'分享'})[w]||w}

function render(){
  $('spendMoney').textContent=fmt(data.wallets.spend); $('saveMoney').textContent=fmt(data.wallets.save); $('shareMoney').textContent=fmt(data.wallets.share);
  $('totalMoney').textContent=fmt(data.wallets.spend+data.wallets.save+data.wallets.share);
  $('headerAvatar').textContent=data.profile.avatar||'🐰'; $('helloName').textContent=(data.profile.name||'小小理財家')+'的錢錢';
  $('childName').value=data.profile.name||''; $('avatarSelect').value=data.profile.avatar||'🐰';
  renderRecent(); renderTasks(); renderGoals(); renderHome(); renderBadges(); renderReview();
}
function renderHome(){
  const m=monthTotals(monthNow());
  $('mIncome').textContent=fmt(m.income);$('mExpense').textContent=fmt(m.expense);$('mSaved').textContent=fmt(m.saved);
  const openTasks=data.tasks.filter(t=>!t.done).slice(0,3);
  $('homeTasks').innerHTML=openTasks.length?openTasks.map(taskHtml).join(''):'<div class="empty">目前沒有任務，可以新增一個 🌱</div>';
  const goals=data.goals.filter(g=>!g.done).slice(0,2);
  $('homeGoals').innerHTML=goals.length?goals.map(goalHtml).join(''):'<div class="empty">還沒有願望，先設定第一個吧 🎁</div>';
}
function renderRecent(){
  const a=data.tx.slice().reverse().slice(0,20);
  $('txList').innerHTML=a.length?a.map(txHtml).join(''):'<div class="empty">還沒有紀錄 🌱</div>';
}
function txHtml(t){
  return `<div class="tx"><div>${t.type==='income'?'🪙':'🛍️'} ${esc(t.note||t.category||'沒有備註')}<div class="mini">${t.date} ・ ${walletName(t.wallet)}</div>${t.kind==='need'?'<span class="tag need">需要</span>':t.kind==='want'?'<span class="tag want">想要</span>':''}</div><b class="${t.type==='income'?'plus':'minus'}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</b></div>`
}
function addTx(){
  const amount=Number($('amount').value),type=$('type').value,wallet=$('wallet').value;
  if(!amount||amount<=0)return toast('先輸入金額喔');
  if(type==='expense'&&data.wallets[wallet]<amount)return toast('這個錢包的錢不夠喔');
  data.wallets[wallet]+=type==='income'?amount:-amount;
  data.tx.push({id:Date.now(),type,wallet,amount,date:$('date').value||today(),kind:$('kind').value,category:$('category').value,note:$('note').value.trim()});
  $('amount').value='';$('note').value='';checkBadges();save();toast('記好了！✨')
}
function quickAdd(type){go('record');$('type').value=type;setTimeout(()=>$('amount').focus(),80)}

function addTask(){
  const name=$('taskName').value.trim(),reward=Number($('taskReward').value),wallet=$('taskWallet').value;
  if(!name)return toast('先輸入任務名稱');
  if(!reward||reward<=0)return toast('請輸入獎勵金額');
  data.tasks.push({id:Date.now(),name,reward,wallet,done:false,doneDate:null});
  $('taskName').value='';$('taskReward').value='';save();toast('任務新增完成 ✅')
}
function completeTask(id){
  const t=data.tasks.find(x=>x.id===id);if(!t||t.done)return;
  t.done=true;t.doneDate=today();data.wallets[t.wallet]+=Number(t.reward);
  data.tx.push({id:Date.now(),type:'income',wallet:t.wallet,amount:Number(t.reward),date:today(),kind:'none',category:'任務獎勵',note:'完成任務：'+t.name});
  checkBadges();save();toast('任務完成，獎勵已存入 🎉')
}
function taskHtml(t){
  return `<div class="task ${t.done?'taskdone':''}"><div><b>${esc(t.name)}</b><div class="mini">獎勵 ${fmt(t.reward)} → ${walletName(t.wallet)}</div></div>${t.done?'<span>✅</span>':`<button class="amountbtn" onclick="completeTask(${t.id})">完成</button>`}</div>`
}
function renderTasks(){
  const list=data.tasks.slice().reverse();
  $('taskList').innerHTML=list.length?list.map(taskHtml).join(''):'<div class="empty">還沒有任務</div>';
}

let pendingGoalImage=null;
function loadGoalImage(e){
  const f=e.target.files?.[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{pendingGoalImage=r.result;$('goalPreview').innerHTML=`<img src="${pendingGoalImage}">`};r.readAsDataURL(f)
}
function addGoal(){
  const name=$('goalName').value.trim(),target=Number($('goalTarget').value);
  if(!name)return toast('先輸入願望名稱');
  if(!target||target<=0)return toast('請輸入目標金額');
  data.goals.push({id:Date.now(),name,target,emoji:$('goalEmoji').value||'🎁',image:pendingGoalImage||'',saved:0,done:false});
  $('goalName').value='';$('goalTarget').value='';$('goalEmoji').value='🎁';pendingGoalImage=null;$('goalPreview').textContent='📷 可以放願望圖片';
  save();toast('願望新增完成 🎯')
}
function goalHtml(g){
  const pct=Math.max(0,Math.min(100,g.target?g.saved/g.target*100:0));
  const pic=g.image?`<img src="${g.image}">`:esc(g.emoji||'🎁');
  return `<div class="goalrow"><div class="goalmain"><div class="goalpic">${pic}</div><div class="goalinfo"><b>${esc(g.name)}</b><div class="mini">${fmt(g.saved)} / ${fmt(g.target)} ・ 還差 ${fmt(Math.max(0,g.target-g.saved))}</div><div class="bar"><i style="width:${pct}%"></i></div></div></div>${g.done?'🏆':`<button class="amountbtn" onclick="fundGoal(${g.id})">存錢</button>`}</div>`
}
function renderGoals(){
  const list=data.goals.slice().reverse();
  $('goalList').innerHTML=list.length?list.map(goalHtml).join(''):'<div class="empty">還沒有願望</div>';
}
function fundGoal(id){
  const g=data.goals.find(x=>x.id===id);if(!g||g.done)return;
  const raw=prompt(`要從「存起來」放多少到「${g.name}」？\n目前存起來：${fmt(data.wallets.save)}`);
  if(raw===null)return;const amount=Number(raw);
  if(!amount||amount<=0)return toast('金額不正確');
  if(data.wallets.save<amount)return toast('存起來的錢不夠喔');
  const need=Math.max(0,g.target-g.saved),actual=Math.min(amount,need);
  data.wallets.save-=actual;g.saved+=actual;
  data.transfers.push({id:Date.now(),date:today(),from:'save',to:'goal',goalId:g.id,amount:actual});
  if(g.saved>=g.target){g.done=true;unlock('goalDone')}
  save();toast(g.done?'願望達成啦！🏆':'已放進願望存款 ✨')
}

function transferMoney(){
  const from=$('fromWallet').value,to=$('toWallet').value,amount=Number($('transferAmount').value);
  if(from===to)return toast('來源和目的不能一樣');
  if(!amount||amount<=0)return toast('請輸入轉帳金額');
  if(data.wallets[from]<amount)return toast('來源錢包餘額不足');
  data.wallets[from]-=amount;data.wallets[to]+=amount;
  data.transfers.push({id:Date.now(),date:today(),from,to,amount});
  $('transferAmount').value='';unlock('transfer');save();toast('轉帳完成 🔁')
}

function monthTotals(month){
  const rows=data.tx.filter(t=>String(t.date||'').startsWith(month));
  const income=rows.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0);
  const expense=rows.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);
  const saved=rows.filter(t=>t.type==='income'&&t.wallet==='save').reduce((s,t)=>s+Number(t.amount),0);
  const need=rows.filter(t=>t.type==='expense'&&t.kind==='need').reduce((s,t)=>s+Number(t.amount),0);
  const want=rows.filter(t=>t.type==='expense'&&t.kind==='want').reduce((s,t)=>s+Number(t.amount),0);
  return {rows,income,expense,saved,need,want,none:expense-need-want};
}
function renderReview(){
  const month=$('reviewMonth').value||monthNow(),m=monthTotals(month),remain=m.income-m.expense;
  let msg='這個月還沒有太多紀錄，慢慢開始就很好 🌱';
  if(m.income>0){
    if(m.saved>=m.income*.3) msg='這個月很會存錢！你有把一部分收入留給未來的自己 🌟';
    else if(m.want>m.need && m.want>0) msg='這個月「想要」花費比較多，下次買之前可以多想一下喔 💭';
    else if(m.expense<=m.income*.6) msg='這個月花費控制得不錯，繼續保持 👍';
    else msg='有記錄就已經很棒，下個月可以試著多留一點錢給存款。';
  }
  $('reviewCard').innerHTML=`<div class="sub">${month} 回顧</div><div class="reviewbig">${remain>=0?'還留下 '+fmt(remain):'花得比收入多 '+fmt(Math.abs(remain))}</div><div class="reviewline">🪙 收入：${fmt(m.income)}</div><div class="reviewline">🛍️ 花費：${fmt(m.expense)}</div><div class="reviewline">🌟 存進存款：${fmt(m.saved)}</div><div class="reviewmsg">${msg}</div>`;
  $('rNeed').textContent=fmt(m.need);$('rWant').textContent=fmt(m.want);$('rNone').textContent=fmt(m.none)
}

const badgeDefs={
 first:['🌱','第一筆','完成第一筆紀錄'],
 five:['⭐','小小高手','完成 5 筆紀錄'],
 saver:['🐷','存錢豬','3 次把收入放進存起來'],
 task3:['✅','任務達人','完成 3 個任務'],
 transfer:['🔁','會分配','完成第一次錢包轉帳'],
 goalDone:['🏆','願望達成','完成第一個存錢願望'],
 record20:['📚','記帳高手','累積 20 筆紀錄']
};
function unlock(id){if(!data.badges.includes(id))data.badges.push(id)}
function checkBadges(){
  if(data.tx.length>=1)unlock('first');
  if(data.tx.length>=5)unlock('five');
  if(data.tx.length>=20)unlock('record20');
  if(data.tx.filter(t=>t.type==='income'&&t.wallet==='save').length>=3)unlock('saver');
  if(data.tasks.filter(t=>t.done).length>=3)unlock('task3');
}
function renderBadges(){
  $('badgeWall').innerHTML=Object.entries(badgeDefs).map(([k,v])=>`<div class="badge" style="${data.badges.includes(k)?'':'filter:grayscale(1);opacity:.45'}"><span>${v[0]}</span><b>${v[1]}</b><div class="mini">${v[2]}</div></div>`).join('')
}

function saveProfile(){data.profile={name:$('childName').value.trim()||'小小理財家',avatar:$('avatarSelect').value||'🐰'};save();toast('儲存好了 💗')}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));window.scrollTo({top:0,behavior:'smooth'})}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function exportBackup(){
  const blob=new Blob([JSON.stringify({app:'我的錢錢小管家',version:4,exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${data.profile.name||'小朋友'}_錢錢備份_${today()}.json`;a.click();URL.revokeObjectURL(a.href)
}
function importBackup(e){
  const f=e.target.files?.[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result),x=o.data||o;if(!x.wallets||!x.tx)throw 0;data=x;if(!data.tasks)data.tasks=[];if(!data.goals)data.goals=[];if(!data.badges)data.badges=[];if(!data.transfers)data.transfers=[];save();toast('匯入成功 ✨')}catch{toast('備份檔無法讀取')}};r.readAsText(f)
}
function resetAll(){if(confirm('確定要清除全部資料嗎？')){data=JSON.parse(JSON.stringify(defaultData));localStorage.removeItem(KEY);save();toast('已重新開始 🌱')}}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
checkBadges();render();
</script>
