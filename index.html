<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="錢錢小管家">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>我的錢錢小管家</title>
<style>
:root{
 --accent:#f7c9d9;--accent2:#d9cff6;--accentSoft:#fff1f6;--bg1:#fff8fb;--bg2:#fffdf8;
 --card:#fff;--ink:#514a56;--muted:#8b8390;--line:#eee7ee;--mint:#ccefdc;--blue:#cdeafa;
 --yellow:#ffe7a9;--shadow:0 10px 30px rgba(82,65,89,.09)
}
:root[data-theme="purple"]{--accent:#d9cff6;--accent2:#c7b7f0;--accentSoft:#f4efff}
:root[data-theme="blue"]{--accent:#cdeafa;--accent2:#b6dcf3;--accentSoft:#eef9ff}
:root[data-theme="green"]{--accent:#ccefdc;--accent2:#b8e4cd;--accentSoft:#edf9f2}
:root[data-mode="dark"]{--bg1:#1f1b22;--bg2:#171419;--card:#2b252e;--ink:#f5eef7;--muted:#b9aebd;--line:#413847;--accentSoft:#3a3038;--shadow:0 10px 30px rgba(0,0,0,.25)}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--ink)}
button,input,select{font:inherit}
.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:105px}
header{padding:16px 15px 8px}.hello{display:flex;justify-content:space-between;align-items:center}.who{display:flex;gap:10px;align-items:center}
.avatar{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:31px;box-shadow:var(--shadow)}
h1{font-size:22px;margin:0}.sub,.mini{font-size:12px;color:var(--muted)}
main{padding:8px 15px 24px}.page{display:none}.page.active{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px}
.hero{background:linear-gradient(135deg,var(--accentSoft),var(--card));border-radius:30px;padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"✨";position:absolute;right:18px;top:12px;font-size:38px;opacity:.65}
.heroTitle{font-size:14px;color:var(--muted)}.heroMoney{font-size:38px;font-weight:900;margin:4px 0 12px}
.quickGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.quickCard{border:0;border-radius:22px;padding:14px 8px;background:var(--card);box-shadow:var(--shadow);color:var(--ink)}
.quickCard span{font-size:26px;display:block;margin-bottom:6px}.quickCard b{font-size:12px}
.section{margin-top:18px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px}.section-title h2{font-size:18px;margin:0}.link{border:0;background:transparent;color:#8068b8;font-weight:700}
.wallets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.wallet{padding:12px 7px;border-radius:18px;text-align:center;font-size:12px}.wallet b{display:block;font-size:16px;margin-top:4px}
.w1{background:var(--accentSoft)}.w2{background:#f2efff}.w3{background:#eef9ff}
:root[data-mode="dark"] .w2,:root[data-mode="dark"] .w3{background:#352e39}
.primary,.secondary,.tiny{border-radius:18px;padding:12px;font-weight:800}.primary{width:100%;border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#4e3f59}.secondary{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink)}.tiny{width:auto;padding:7px 9px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:11px}
input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:15px;background:var(--card);color:var(--ink)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tx,.task,.goalrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--line)}.tx:last-child,.task:last-child,.goalrow:last-child{border-bottom:0}
.goalmain{display:flex;gap:10px;align-items:center;flex:1}.goalpic{width:56px;height:56px;border-radius:18px;background:#fff5cf;display:grid;place-items:center;font-size:30px}.goalinfo{flex:1}.bar{height:9px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.eta{font-size:11px;color:var(--muted);margin-top:5px}.manageBtns{display:flex;gap:6px}.manageBtns button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:6px 8px;font-size:11px}
.priority{display:inline-block;font-size:10px;padding:4px 7px;border-radius:999px;margin-top:4px}.p1{background:#ffe5ec;color:#a44d68}.p2{background:#fff5cf;color:#8b6b16}.p3{background:#eef0f5;color:#687083}
.calendarControls{display:flex;gap:8px;align-items:center}.calendarControls input{flex:1}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.weekDay,.calDay{border-radius:14px;background:var(--accentSoft);padding:9px 3px;text-align:center;font-size:11px}
.weekDay b,.calDay b{display:block;font-size:15px}.weekDay.today,.calDay.today{outline:2px solid var(--accent)}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.calHead{text-align:center;font-size:11px;color:var(--muted);padding-bottom:4px}.calDay{min-height:65px;background:var(--card);border:1px solid var(--line);text-align:left;padding:6px}
.calDot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}.inDot{background:#55a878}.outDot{background:#cf5f7d}.taskDot{background:#8f79c9}
.daySummary{margin-top:10px}.summaryItem{padding:10px 0;border-bottom:1px solid var(--line)}.summaryItem:last-child{border-bottom:0}
nav{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(520px,calc(100% - 20px));display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:color-mix(in srgb,var(--card) 94%, transparent);backdrop-filter:blur(14px);padding:7px;border-radius:24px;box-shadow:0 12px 40px rgba(65,48,75,.18);z-index:20}
nav button{border:0;background:transparent;padding:8px 1px;border-radius:16px;color:var(--muted);font-size:10px}nav button.active{background:var(--accentSoft);color:#684fa0;font-weight:800}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#514a56;color:#fff;padding:10px 14px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1}.empty{text-align:center;color:var(--muted);padding:18px}
.modal{position:fixed;inset:0;background:rgba(60,50,65,.35);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.show{display:flex}.sheet{width:min(560px,100%);background:var(--card);border-radius:28px 28px 0 0;padding:18px 16px 28px;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<div class="app">
<header>
<div class="hello">
  <div class="who"><div class="avatar" id="headerAvatar">🐰</div><div><div class="sub">今天也來照顧你的錢錢 ✨</div><h1 id="helloName">我的錢錢</h1></div></div>
  <button class="tiny" onclick="go('profile')">⚙️</button>
</div>
</header>

<main>
<section id="home" class="page active">
  <div class="hero">
    <div class="heroTitle">今天可以安心管理多少錢？</div>
    <div class="heroMoney" id="totalMoney">$0</div>
    <div class="wallets">
      <div class="wallet w1">💗 可以花<b id="spendMoney">$0</b></div>
      <div class="wallet w2">🌟 存起來<b id="saveMoney">$0</b></div>
      <div class="wallet w3">🤝 分享<b id="shareMoney">$0</b></div>
    </div>
  </div>

  <div class="section">
    <div class="quickGrid">
      <button class="quickCard" onclick="quickAdd('income')"><span>🪙</span><b>收到錢</b></button>
      <button class="quickCard" onclick="quickAdd('expense')"><span>🛍️</span><b>花了一筆</b></button>
      <button class="quickCard" onclick="go('calendar')"><span>📅</span><b>看看日曆</b></button>
    </div>
  </div>

  <div class="section"><div class="section-title"><h2>🎯 最想完成的願望</h2><button class="link" onclick="go('goals')">全部願望</button></div><div class="card" id="homeGoals"></div></div>
  <div class="section"><div class="section-title"><h2>✅ 今天的小任務</h2><button class="link" onclick="go('tasks')">全部任務</button></div><div class="card" id="homeTasks"></div></div>
</section>

<section id="record" class="page">
  <div class="section-title"><h2>🧾 記一筆錢錢</h2></div>
  <div class="card">
    <div class="form-row"><select id="type"><option value="income">收入</option><option value="expense">支出</option></select><input id="amount" inputmode="numeric" placeholder="金額"></div>
    <div class="form-row"><select id="wallet"><option value="spend">可以花</option><option value="save">存起來</option><option value="share">分享</option></select><input id="date" type="date"></div>
    <div class="form-row"><select id="kind"><option value="none">不分類</option><option value="need">需要</option><option value="want">想要</option></select><select id="category"></select></div>
    <input id="note" placeholder="這筆是什麼？" style="margin-bottom:10px">
    <button class="primary" onclick="addTx()">存起來</button>
  </div>
  <div class="section"><div class="card" id="txList"></div></div>
</section>

<section id="tasks" class="page">
  <div class="section-title"><h2>✅ 任務賺零用錢</h2></div>
  <div class="card">
    <input id="taskName" placeholder="任務名稱" style="margin-bottom:10px">
    <div class="form-row"><input id="taskReward" inputmode="numeric" placeholder="獎勵金額"><select id="taskWallet"><option value="spend">可以花</option><option value="save">存起來</option><option value="share">分享</option></select></div>
    <button class="primary" onclick="addTask()">新增任務</button>
  </div>
  <div class="section"><div class="card" id="taskList"></div></div>
</section>

<section id="goals" class="page">
  <div class="section-title"><h2>🎯 願望清單</h2></div>
  <div class="card">
    <input id="goalName" placeholder="願望名稱" style="margin-bottom:10px">
    <div class="form-row"><input id="goalTarget" inputmode="numeric" placeholder="目標金額"><input id="goalEmoji" maxlength="2" value="🎁"></div>
    <select id="goalPriority" style="margin-bottom:10px"><option value="1">🔥 最想要</option><option value="2">🙂 可以等等</option><option value="3">👀 只是看看</option></select>
    <button class="primary" onclick="addGoal()">新增願望</button>
  </div>
  <div class="section"><div class="card" id="goalList"></div></div>
</section>

<section id="calendar" class="page">
  <div class="section-title"><h2>📅 我的錢錢日曆</h2></div>
  <div class="card">
    <div class="calendarControls">
      <select id="calendarMode" onchange="renderCalendar()"><option value="week">週曆</option><option value="month">月曆</option></select>
      <input id="calendarDate" type="date" onchange="renderCalendar()">
    </div>
  </div>
  <div class="section"><div class="card" id="calendarView"></div></div>
  <div class="section"><div class="card daySummary" id="daySummary"></div></div>
</section>

<section id="review" class="page">
  <div class="section-title"><h2>📊 每月回顧</h2></div>
  <div class="card"><input id="reviewMonth" type="month" onchange="renderReview()"></div>
  <div class="section"><div class="card" id="reviewCard"></div></div>
</section>

<section id="profile" class="page">
  <div class="section-title"><h2>👤 我的設定</h2></div>
  <div class="card">
    <input id="childName" placeholder="我的名字" style="margin-bottom:10px">
    <select id="avatarSelect" style="margin-bottom:10px"><option value="🐰">🐰 兔兔</option><option value="🐻">🐻 小熊</option><option value="🐱">🐱 貓咪</option><option value="🐶">🐶 狗狗</option><option value="🦄">🦄 獨角獸</option></select>
    <div class="form-row"><select id="modeSelect" onchange="saveAppearance()"><option value="light">亮色模式</option><option value="dark">深色模式</option></select><select id="themeSelect" onchange="saveAppearance()"><option value="pink">粉紅</option><option value="purple">淡紫</option><option value="blue">天空藍</option><option value="green">薄荷綠</option></select></div>
    <button class="primary" onclick="saveProfile()">儲存設定</button>
  </div>
</section>
</main>

<nav>
<button class="active" data-page="home" onclick="go('home')">🏠<br>首頁</button>
<button data-page="record" onclick="go('record')">✏️<br>記帳</button>
<button data-page="tasks" onclick="go('tasks')">✅<br>任務</button>
<button data-page="goals" onclick="go('goals')">🎯<br>願望</button>
<button data-page="calendar" onclick="go('calendar')">📅<br>日曆</button>
<button data-page="review" onclick="go('review')">📊<br>回顧</button>
</nav>
</div>

<div class="modal" id="goalEditModal">
  <div class="sheet">
    <div class="section-title"><h2>✏️ 編輯願望</h2><button class="tiny" onclick="closeGoalEdit()">關閉</button></div>
    <input id="eGoalName" style="margin-bottom:10px">
    <div class="form-row"><input id="eGoalTarget" inputmode="numeric"><input id="eGoalEmoji" maxlength="2"></div>
    <select id="eGoalPriority" style="margin-bottom:10px"><option value="1">🔥 最想要</option><option value="2">🙂 可以等等</option><option value="3">👀 只是看看</option></select>
    <button class="primary" onclick="saveGoalEdit()">儲存修改</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='kidsMoneyAppV7_1', OLD=['kidsMoneyAppV7','kidsMoneyAppV6','kidsMoneyAppV5','kidsMoneyAppV4','kidsMoneyAppV3','kidsMoneyAppV2'];
const defaultData={
 profile:{name:'小小理財家',avatar:'🐰'},wallets:{spend:0,save:0,share:0},tx:[],tasks:[],goals:[],badges:[],transfers:[],
 categories:['零用錢','獎勵','文具','點心','玩具','其他'],appearance:{mode:'light',theme:'pink'}
};
function normalize(x){
  const d={...JSON.parse(JSON.stringify(defaultData)),...x};
  d.profile=x.profile||defaultData.profile;d.wallets=x.wallets||defaultData.wallets;d.tx=x.tx||[];d.tasks=x.tasks||[];d.goals=(x.goals||[]).map(g=>({...g,priority:String(g.priority||2)}));
  d.badges=x.badges||[];d.transfers=x.transfers||[];d.categories=x.categories||[...defaultData.categories];d.appearance=x.appearance||{...defaultData.appearance};
  return d;
}
function migrate(){
  let r=localStorage.getItem(KEY);if(r)return normalize(JSON.parse(r));
  for(const k of OLD){const o=localStorage.getItem(k);if(o){const x=normalize(JSON.parse(o));localStorage.setItem(KEY,JSON.stringify(x));return x}}
  return JSON.parse(JSON.stringify(defaultData));
}
let data=migrate(), currentGoalId=null;
const $=id=>document.getElementById(id);
function today(){return new Date().toISOString().slice(0,10)}
function fmt(n){return '$'+Math.round(Number(n)||0).toLocaleString('zh-TW')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function walletName(w){return ({spend:'可以花',save:'存起來',share:'分享'})[w]||w}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function applyAppearance(){document.documentElement.dataset.mode=data.appearance.mode||'light';document.documentElement.dataset.theme=data.appearance.theme||'pink'}
applyAppearance();$('date').value=today();$('calendarDate').value=today();$('reviewMonth').value=today().slice(0,7);

function render(){
  $('spendMoney').textContent=fmt(data.wallets.spend);$('saveMoney').textContent=fmt(data.wallets.save);$('shareMoney').textContent=fmt(data.wallets.share);$('totalMoney').textContent=fmt(data.wallets.spend+data.wallets.save+data.wallets.share);
  $('headerAvatar').textContent=data.profile.avatar||'🐰';$('helloName').textContent=(data.profile.name||'小小理財家')+'的錢錢';
  $('childName').value=data.profile.name||'';$('avatarSelect').value=data.profile.avatar||'🐰';$('modeSelect').value=data.appearance.mode||'light';$('themeSelect').value=data.appearance.theme||'pink';
  $('category').innerHTML=data.categories.map(c=>`<option>${esc(c)}</option>`).join('');
  renderRecent();renderTasks();renderGoals();renderHome();renderCalendar();renderReview();
}
function sortedGoals(){
  return [...data.goals].sort((a,b)=>Number(a.done)-Number(b.done)||Number(a.priority||2)-Number(b.priority||2)||Number(a.id)-Number(b.id));
}
function priorityLabel(p){return p==='1'?['🔥 最想要','p1']:p==='2'?['🙂 可以等等','p2']:['👀 只是看看','p3']}
function recentMonthlySavingForGoal(goalId){
  const now=new Date(),since=new Date(now);since.setDate(now.getDate()-90);
  const gt=(data.transfers||[]).filter(t=>t.goalId===goalId&&t.to==='goal'&&new Date(t.date)>=since);let total=gt.reduce((s,t)=>s+Number(t.amount),0);
  if(total>0)return total/3;
  return data.tx.filter(t=>t.type==='income'&&t.wallet==='save'&&new Date(t.date)>=since).reduce((s,t)=>s+Number(t.amount),0)/3;
}
function goalEta(g){
  if(g.done)return '已達成';
  const remain=Math.max(0,Number(g.target)-Number(g.saved||0)),avg=recentMonthlySavingForGoal(g.id);
  if(avg<=0)return '再存幾次後就能估算';
  const months=Math.max(1,Math.ceil(remain/avg)),d=new Date();d.setMonth(d.getMonth()+months);
  return `約 ${months} 個月，預估 ${d.getFullYear()}/${d.getMonth()+1} 達成`;
}
function goalHtml(g,compact=false){
  const pct=Math.max(0,Math.min(100,Number(g.saved||0)/Number(g.target||1)*100)),[pl,pc]=priorityLabel(String(g.priority||2));
  return `<div class="goalrow"><div class="goalmain"><div class="goalpic">${esc(g.emoji||'🎁')}</div><div class="goalinfo"><b>${esc(g.name)}</b><div><span class="priority ${pc}">${pl}</span></div><div class="mini">${fmt(g.saved||0)} / ${fmt(g.target)}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="eta">📅 ${esc(goalEta(g))}</div></div></div>${compact?'':`<div class="manageBtns">${g.done?'🏆':`<button onclick="fundGoal(${g.id})">存錢</button>`}<button onclick="editGoal(${g.id})">編輯</button></div>`}</div>`;
}
function renderHome(){
  const gs=sortedGoals().filter(g=>!g.done).slice(0,1);$('homeGoals').innerHTML=gs.length?gs.map(g=>goalHtml(g,true)).join(''):'<div class="empty">還沒有願望 🎁</div>';
  const ts=data.tasks.filter(t=>!t.done).slice(0,3);$('homeTasks').innerHTML=ts.length?ts.map(taskHtml).join(''):'<div class="empty">今天沒有任務 🌱</div>';
}
function addTx(){
  const amount=Number($('amount').value),type=$('type').value,wallet=$('wallet').value;if(!amount||amount<=0)return toast('先輸入金額喔');if(type==='expense'&&data.wallets[wallet]<amount)return toast('這個錢包的錢不夠喔');
  data.wallets[wallet]+=type==='income'?amount:-amount;data.tx.push({id:Date.now(),type,wallet,amount,date:$('date').value||today(),kind:$('kind').value,category:$('category').value,note:$('note').value.trim()});$('amount').value='';$('note').value='';save();toast('記好了！✨')
}
function quickAdd(t){go('record');$('type').value=t}
function renderRecent(){const a=data.tx.slice().reverse().slice(0,20);$('txList').innerHTML=a.length?a.map(t=>`<div class="tx"><div>${t.type==='income'?'🪙':'🛍️'} ${esc(t.note||t.category)}<div class="mini">${t.date} ・ ${walletName(t.wallet)}</div></div><b>${t.type==='income'?'+':'-'}${fmt(t.amount)}</b></div>`).join(''):'<div class="empty">還沒有紀錄</div>'}
function addTask(){const n=$('taskName').value.trim(),r=Number($('taskReward').value),w=$('taskWallet').value;if(!n||!r)return toast('請填任務名稱和獎勵');data.tasks.push({id:Date.now(),name:n,reward:r,wallet:w,done:false});$('taskName').value='';$('taskReward').value='';save()}
function completeTask(id){const t=data.tasks.find(x=>x.id===id);if(!t||t.done)return;t.done=true;t.doneDate=today();data.wallets[t.wallet]+=Number(t.reward);data.tx.push({id:Date.now(),type:'income',wallet:t.wallet,amount:Number(t.reward),date:today(),kind:'none',category:'獎勵',note:'完成任務：'+t.name});save()}
function taskHtml(t){return `<div class="task"><div><b>${esc(t.name)}</b><div class="mini">${fmt(t.reward)} → ${walletName(t.wallet)}</div></div>${t.done?'✅':`<button class="tiny" onclick="completeTask(${t.id})">完成</button>`}</div>`}
function renderTasks(){const l=data.tasks.slice().reverse();$('taskList').innerHTML=l.length?l.map(taskHtml).join(''):'<div class="empty">還沒有任務</div>'}
function addGoal(){const n=$('goalName').value.trim(),t=Number($('goalTarget').value);if(!n||!t)return toast('請填願望名稱和金額');data.goals.push({id:Date.now(),name:n,target:t,emoji:$('goalEmoji').value||'🎁',saved:0,done:false,priority:$('goalPriority').value,createdAt:today()});$('goalName').value='';$('goalTarget').value='';save()}
function renderGoals(){const l=sortedGoals();$('goalList').innerHTML=l.length?l.map(g=>goalHtml(g,false)).join(''):'<div class="empty">還沒有願望</div>'}
function fundGoal(id){const g=data.goals.find(x=>x.id===id);if(!g||g.done)return;const raw=prompt(`從「存起來」放多少到「${g.name}」？`);if(raw===null)return;const a=Number(raw);if(!a||data.wallets.save<a)return toast('金額不正確或存款不足');const actual=Math.min(a,Number(g.target)-Number(g.saved||0));data.wallets.save-=actual;g.saved=Number(g.saved||0)+actual;data.transfers.push({id:Date.now(),date:today(),from:'save',to:'goal',goalId:g.id,amount:actual});if(g.saved>=g.target)g.done=true;save()}
function editGoal(id){const g=data.goals.find(x=>x.id===id);if(!g)return;currentGoalId=id;$('eGoalName').value=g.name;$('eGoalTarget').value=g.target;$('eGoalEmoji').value=g.emoji||'🎁';$('eGoalPriority').value=String(g.priority||2);$('goalEditModal').classList.add('show')}
function closeGoalEdit(){$('goalEditModal').classList.remove('show');currentGoalId=null}
function saveGoalEdit(){const g=data.goals.find(x=>x.id===currentGoalId);if(!g)return;const t=Number($('eGoalTarget').value);if(!t||t<Number(g.saved||0))return toast('目標金額不能小於已存金額');g.name=$('eGoalName').value.trim()||g.name;g.target=t;g.emoji=$('eGoalEmoji').value||'🎁';g.priority=$('eGoalPriority').value;closeGoalEdit();save()}
function renderCalendar(){
  const mode=$('calendarMode').value,base=new Date($('calendarDate').value||today());
  if(mode==='week')renderWeek(base);else renderMonth(base);
  renderDaySummary($('calendarDate').value||today());
}
function renderWeek(base){
  const day=base.getDay(),start=new Date(base);start.setDate(base.getDate()-day);
  let html='<div class="week">';
  for(let i=0;i<7;i++){const d=new Date(start);d.setDate(start.getDate()+i);const key=d.toISOString().slice(0,10),isToday=key===today(),txs=data.tx.filter(t=>t.date===key),tasks=data.tasks.filter(t=>t.doneDate===key);html+=`<div class="weekDay ${isToday?'today':''}" onclick="selectDay('${key}')"><div>${['日','一','二','三','四','五','六'][d.getDay()]}</div><b>${d.getDate()}</b><div>${txs.length?'💰':''}${tasks.length?'✅':''}</div></div>`}html+='</div>';$('calendarView').innerHTML=html
}
function renderMonth(base){
  const y=base.getFullYear(),m=base.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0);let html='<div class="calGrid">';['日','一','二','三','四','五','六'].forEach(x=>html+=`<div class="calHead">${x}</div>`);for(let i=0;i<first.getDay();i++)html+='<div></div>';
  for(let d=1;d<=last.getDate();d++){const dt=new Date(y,m,d),key=dt.toISOString().slice(0,10),txs=data.tx.filter(t=>t.date===key),tasks=data.tasks.filter(t=>t.doneDate===key);html+=`<div class="calDay ${key===today()?'today':''}" onclick="selectDay('${key}')"><b>${d}</b><div>${txs.some(t=>t.type==='income')?'<span class="calDot inDot"></span>':''}${txs.some(t=>t.type==='expense')?'<span class="calDot outDot"></span>':''}${tasks.length?'<span class="calDot taskDot"></span>':''}</div></div>`}html+='</div>';$('calendarView').innerHTML=html
}
function selectDay(key){$('calendarDate').value=key;renderDaySummary(key)}
function renderDaySummary(key){
  const txs=data.tx.filter(t=>t.date===key),tasks=data.tasks.filter(t=>t.doneDate===key);
  let html=`<div class="section-title"><h2>${key}</h2></div>`;
  if(!txs.length&&!tasks.length)html+='<div class="empty">這天還沒有紀錄</div>';
  txs.forEach(t=>html+=`<div class="summaryItem">${t.type==='income'?'🪙':'🛍️'} ${esc(t.note||t.category)} <b>${t.type==='income'?'+':'-'}${fmt(t.amount)}</b></div>`);
  tasks.forEach(t=>html+=`<div class="summaryItem">✅ 完成任務：${esc(t.name)}</div>`);
  $('daySummary').innerHTML=html
}
function renderReview(){const m=$('reviewMonth').value||today().slice(0,7),rows=data.tx.filter(t=>t.date?.startsWith(m)),inc=rows.filter(t=>t.type==='income').reduce((s,t)=>s+Number(t.amount),0),exp=rows.filter(t=>t.type==='expense').reduce((s,t)=>s+Number(t.amount),0);$('reviewCard').innerHTML=`<b>${m}</b><div class="heroMoney" style="font-size:28px">${fmt(inc-exp)}</div><div class="mini">收入 ${fmt(inc)} ・ 花費 ${fmt(exp)}</div>`}
function saveProfile(){data.profile={name:$('childName').value.trim()||'小小理財家',avatar:$('avatarSelect').value||'🐰'};save()}
function saveAppearance(){data.appearance.mode=$('modeSelect').value;data.appearance.theme=$('themeSelect').value;applyAppearance();save()}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===id));window.scrollTo({top:0,behavior:'smooth'})}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script>
</body>
</html>
